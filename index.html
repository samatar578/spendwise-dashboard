<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-icon">💸</span>
            <h1 class="brand-name">SpendWise</h1>
        </div>
        <nav class="nav">
            <a href="#" class="nav-item active"><span>🏠</span> Dashboard</a>
            <a href="#" class="nav-item"><span>💰</span> Transactions</a>
            <a href="#" class="nav-item"><span>📊</span> Reports</a>
            <a href="#" class="nav-item"><span>🎯</span> Goals</a>
            <a href="#" class="nav-item"><span>⚙️</span> Settings</a>
        </nav>
    </aside>

    <!-- HEADER -->
    <header class="header">
        <div class="header-title">
            <h2>Welcome back, Samatar 👋</h2>
            <p class="header-subtitle">Here's your financial overview</p>
        </div>
        <div class="header-actions">
            <button class="icon-btn" aria-label="Notifications">🔔</button>
            <button class="icon-btn" aria-label="Profile">👤</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main">

        <!-- SUMMARY PANEL -->
        <section class="summary">
            <h3 class="summary-title">Budget Summary</h3>
            <p>Monthly Budget: <span id="summary-budget">KES 0</span></p>
            <p>Total Expenses: <span id="summary-expenses">KES 0</span></p>
            <p>Remaining Balance: <span id="summary-balance">KES 0</span></p>
            <p id="summary-status" class="summary-status">—</p>
        </section>

        <!-- ADD EXPENSE FORM -->
        <section class="add-expense">
            <h3 class="add-expense-title">Add a New Expense</h3>
            <form id="expense-form">
                <label for="expense-name">Expense name</label>
                <input type="text" id="expense-name" placeholder="e.g. Groceries" required>

                <label for="expense-amount">Amount (KES)</label>
                <input type="number" id="expense-amount" placeholder="e.g. 2500" min="0" step="0.01" required>

                <label for="expense-category">Category</label>
                <select id="expense-category" required>
                    <option value="">-- Choose a category --</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Savings">Savings</option>
                    <option value="Utilities">Utilities</option>
                </select>

                <button type="submit" id="add-expense-btn">Add Expense</button>
            </form>
        </section>

        <!-- EXPENSE LIST -->
        <section class="expense-list-section">
            <h3>Your Expenses</h3>
            <ul id="expense-list" class="expense-list">
                <!-- Expenses will be injected here by JavaScript -->
            </ul>
        </section>

    </main>

</div>

<script src="script.js"></script>
</body>
</html>
