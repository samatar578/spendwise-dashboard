<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SpendWise — a smart personal budget and expense dashboard for tracking spending, balances, and financial goals." />
    <meta name="theme-color" content="#0d9488" />
    <title>SpendWise — Personal Finance Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
</head>
<body>

<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar" aria-label="Primary sidebar">
        <div class="brand">
            <span class="brand-icon" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h16v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7" />
                    <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2" />
                    <circle cx="16" cy="14" r="1.5" fill="currentColor" stroke="none" />
                </svg>
            </span>
            <h1 class="brand-name">SpendWise</h1>
        </div>

        <nav class="nav" aria-label="Main navigation">
            <a href="#" class="nav-item active" aria-current="page">
                <span aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1.5" />
                        <rect x="14" y="3" width="7" height="7" rx="1.5" />
                        <rect x="3" y="14" width="7" height="7" rx="1.5" />
                        <rect x="14" y="14" width="7" height="7" rx="1.5" />
                    </svg>
                </span>
                Dashboard
            </a>

            <a href="#" class="nav-item">
                <span aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 7h11l-3-3" />
                        <path d="M17 17H6l3 3" />
                        <path d="M18 7v4" />
                        <path d="M6 17v-4" />
                    </svg>
                </span>
                Transactions
            </a>

            <a href="#" class="nav-item">
                <span aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 20V10" />
                        <path d="M10 20V4" />
                        <path d="M16 20v-7" />
                        <path d="M22 20H2" />
                    </svg>
                </span>
                Reports
            </a>

            <a href="#" class="nav-item">
                <span aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9" />
                        <circle cx="12" cy="12" r="5" />
                        <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
                    </svg>
                </span>
                Goals
            </a>

            <a href="#" class="nav-item">
                <span aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.16.37.38.7.66.98.3.3.68.48 1.1.5H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.52Z" />
                    </svg>
                </span>
                Settings
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-card">
                <p class="sidebar-card-label">Current cycle</p>
                <p class="sidebar-card-value">Monthly budget</p>
            </div>
        </div>
    </aside>

    <!-- HEADER -->
    <header class="header">
        <div class="header-title">
            <h2>Welcome back, Samatar</h2>
            <p class="header-subtitle">Here's your financial overview</p>
        </div>

        <div class="header-actions">
            <button class="icon-btn" type="button" aria-label="View notifications">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
                <span class="notification-dot" aria-hidden="true"></span>
            </button>

            <button class="icon-btn" type="button" aria-label="Open profile menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M4 21a8 8 0 0 1 16 0" />
                </svg>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main" id="main-content">

        <!-- SUMMARY PANEL -->
        <section class="summary" aria-labelledby="summary-title">
            <h3 class="summary-title" id="summary-title">Budget Summary</h3>

            <p>Monthly Budget: <span id="summary-budget">KES 0</span></p>
            <p>Total Expenses: <span id="summary-expenses">KES 0</span></p>
            <p>Remaining Balance: <span id="summary-balance">KES 0</span></p>
            <p id="summary-status" class="summary-status" role="status" aria-live="polite">—</p>
        </section>

        <!-- ADD EXPENSE FORM -->
        <section class="add-expense" aria-labelledby="add-expense-title">
            <h3 class="add-expense-title" id="add-expense-title">Add a New Expense</h3>

            <form id="expense-form">
                <label for="expense-name">Expense name</label>
                <input
                    type="text"
                    id="expense-name"
                    name="expenseName"
                    placeholder="e.g. Groceries"
                    autocomplete="off"
                    maxlength="80"
                    required
                />

                <label for="expense-amount">Amount (KES)</label>
                <input
                    type="number"
                    id="expense-amount"
                    name="expenseAmount"
                    placeholder="e.g. 2500"
                    min="0.01"
                    step="0.01"
                    inputmode="decimal"
                    required
                />

                <label for="expense-category">Category</label>
                <select id="expense-category" name="expenseCategory" required>
                    <option value="" selected disabled>-- Choose a category --</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Savings">Savings</option>
                    <option value="Utilities">Utilities</option>
                </select>

                <button type="submit" id="add-expense-btn">Add Expense</button>
            </form>
        </section>

        <!-- EXPENSE LIST -->
        <section class="expense-list-section" aria-labelledby="expense-list-title">
            <h3 id="expense-list-title">Your Expenses</h3>

            <ul id="expense-list" class="expense-list" aria-live="polite">
                <!-- Expenses will be injected here by JavaScript -->
            </ul>
        </section>

    </main>

</div>

<script src="script.js"></script>
</body>
</html>
